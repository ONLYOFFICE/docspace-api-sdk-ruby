name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Get info
        id: info
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! grep -qxF "## $version" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi
          # Let Ruby evaluate version.rb instead of parsing it (as in create-tag.yml).
          gem_version=$(ruby -e 'load ARGV[0]; print DocspaceApiSdk::VERSION' lib/docspace-api-sdk/version.rb)
          if [ "$gem_version" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match lib/docspace-api-sdk/version.rb ($gem_version)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Gem pre-release versions contain a letter (4.1.0.beta.1).
          if [[ "$version" =~ [A-Za-z] ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build gems
        run: |
          mkdir -p pkg
          gem build docspace-api-sdk.gemspec --output "$PWD/pkg/docspace-api-sdk-${{ steps.info.outputs.version }}.gem"

      - uses: rubygems/configure-rubygems-credentials@v2.1.0

      # A gem whose version is on RubyGems already is skipped, which makes a
      # re-run of this workflow safe.
      - name: Publish to RubyGems
        run: |
          for gem in pkg/*.gem; do
            read -r name version < <(ruby -rrubygems/package -e 's = Gem::Package.new(ARGV[0]).spec; puts "#{s.name} #{s.version}"' "$gem")
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://rubygems.org/api/v2/rubygems/$name/versions/$version.json")
            if [ "$code" = "200" ]; then
              echo "$name $version is already on RubyGems, skipping"
            else
              gem push "$gem"
            fi
          done

      - name: Extract release notes
        env:
          VERSION: ${{ steps.info.outputs.version }}
        run: |
          awk -v head="## $VERSION" '
            $0 == head { p = 1; next }
            /^## / { p = 0 }
            p
          ' CHANGELOG.md > RELEASE.md

      - uses: ncipollo/release-action@v1
        with:
          bodyFile: RELEASE.md
          tag: ${{ github.ref_name }}
          artifacts: pkg/*.gem
          prerelease: ${{ steps.info.outputs.prerelease }}
